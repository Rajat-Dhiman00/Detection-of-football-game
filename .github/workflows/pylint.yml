name: Lint (pylint)

on:
  push:
    branches: [ master ]   # your single branch
  pull_request:
    branches: [ master ]

jobs:
  pylint:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      - name: Run pylint (no‑exit)
        id: pylint
        run: |
          pylint . --exit-zero --output-format=text > pylint_report.txt
          # Pull the numeric rating from the report
          $score = (Select-String -Path pylint_report.txt -Pattern "rated at (\d+\.\d+)/10").Matches[0].Groups[1].Value
          echo "score=$score" >> $Env:GITHUB_OUTPUT

      - name: Show pylint report
        run: type pylint_report.txt

      # ---- OPTIONAL: fail only if score is under a threshold ----
      # Adjust the numeric value (e.g., 7.0) to whatever you consider acceptable.
      - name: Enforce minimum score (optional)
        if: ${{ steps.pylint.outputs.score < 7.0 }}
        run: |
          echo "❌ Pylint score ${{ steps.pylint.outputs.score }} is below the allowed threshold."
          exit 1
